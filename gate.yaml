product: axiomcode
version: "0.4.0"
base_url: https://api.axiom-code.com
types:
  - web
  - payments
test_command: "python3 -m pytest services/api/tests -q"
sensitive_points: true
compliance:
  - payments-via-processor
  - privacy
docs:
  threat_model: docs/THREAT-MODEL.md
  coverage_ledger: docs/COVERAGE-LEDGER.json
  changelog: CHANGELOG.md
routes:
  - path: /health
    methods:
      - GET
    auth: public
    expect_status: 200
  - path: /verify
    methods:
      - POST
    auth: required
    expect_status: 401
    probe_body_json: "{}"
  - path: /verify/jobs/{job_id}
    methods:
      - GET
    auth: required
    expect_status: 401
    probe_path: /verify/jobs/probe
  - path: /check
    methods:
      - POST
    auth: required
    expect_status: 401
    probe_body_json: "{}"
  - path: /mcp
    methods:
      - POST
    auth: required
    expect_status: 401
    probe_body_json: "{}"
  - path: /shell/turn
    methods:
      - POST
    auth: required
    expect_status: 401
    probe_body_json: "{}"
  - path: /shell/jobs/{job_id}
    methods:
      - GET
    auth: required
    expect_status: 401
    probe_path: /shell/jobs/probe
  - path: /revoked
    methods:
      - GET
    auth: public
    expect_status: 200
  - path: /.well-known/axiomcode-keys.json
    methods:
      - GET
    auth: public
    expect_status: 200
  - path: /billing/checkout
    methods:
      - POST
    auth: required
    expect_status: 401
    probe_body_json: "{}"
  - path: /billing/webhook
    methods:
      - POST
    auth: public
    expect_status:
      - 400
      - 501
    probe_body_json: "{}"
payments:
  links:
pathways:
  - id: PW-VERIFY
    covers: /verify
    situation: an authenticated key holder submits a Lean 4 artifact for verification; the first 10 cases per key are a free trial (verdict and transcript, never a certificate), paid cases meter against the key's credit balance and issue a certificate on completion
    gateway: verify_api.verify — the only path from a submission to a proof run; identity comes only from the presented API key (its SHA-256 hash), never from the request body
    validation: API key authenticated against the hashed key store before anything runs; code size cap; per-key rate limit; trial/balance eligibility is checked before any proof runs (402 before compute, never after); when every proof slot is busy the request joins the durable FIFO queue instead of running
  - id: PW-JOB-STATUS
    covers: /verify/jobs/{job_id}
    situation: a key holder checks the position or result of a verification job it queued
    gateway: verify_api.verify_job — the only read path for queued jobs
    validation: the job is returned only to the key that submitted it; any other key (or an unknown job id) answers 404, so job existence never leaks across customers
  - id: PW-CHECK
    covers: /check
    situation: an authenticated key holder asks whether a certificate is valid
    gateway: verify_api.check — verification is recomputed from the certificate and the CA's published key, then the revocation store is consulted
    validation: API key required; a certificate whose signature does not verify, or whose serial is revoked, answers valid=false with the reason; the check is appended to the hash-chained audit log
  - id: PW-PUBLIC-READS
    covers:
      - /health
      - /revoked
      - /.well-known/axiomcode-keys.json
    situation: anyone — customers, relying parties, monitors — reads the service's public trust surface
    gateway: verify_api public routes — read-only views over the revocation store and the CA's public keys
    validation: none — these responses carry no customer data; the keys payload is how third parties verify certificates without trusting the server
  - id: PW-MCP
    covers: /mcp
    situation: an agent caller (an MCP client acting for a developer or an autonomous agent) presents an API key and calls the verification tools — submit a proof, poll a queued job, check a certificate, read the revocation list, usage and pricing; the trial and balance rules are PW-VERIFY's (the first 10 cases per key are a trial, verdicts never certificates)
    gateway: mcp_hosted.McpMount behind KeyAuthMiddleware — the MCP transport's only entry point; every tool calls the same verify_api callables the REST routes call (submit_verification, job_view, check_certificate_body), so admission, metering and revocation cannot drift between the legs
    validation: the API key is authenticated by KeyAuthMiddleware (through verify_api.authenticate_key, the single identity rule) before the MCP app runs; a missing, unknown or revoked key answers one identical 401 body; identity travels in a request-scoped ContextVar and tools take no identity parameter; DNS-rebinding protection is on, with a Host allowlist (loopback + api.axiom-code.com, extensible via AXIOMCODE_MCP_ALLOWED_HOSTS); sessions are stateless; admission is queue-shared with REST (eligibility before admission, durable FIFO when busy), and a job is readable only by the key that submitted it
  - id: PW-SHELL
    covers:
      - /shell/turn
      - /shell/jobs/{job_id}
    situation: an authenticated key holder talks to the service through the website's Ask shell — phrasing what to verify, submitting code or a certificate, polling a queued job, and asking about usage, pricing and revocation — and is answered with code-rendered facts plus an optional explanation from the shell's model
    gateway: verify_api.shell_turn / verify_api.shell_job over services/api/shell.py — the only path from a browser conversation to a service action; every action calls the same verify_api callables the REST routes and MCP tools call (submit_verification, job_view, check_certificate_body via="shell"), so admission, trial counting, metering and revocation cannot drift between legs
    validation: API key authenticated by the same require_api_key dependency before any turn runs; the shell's model never issues, alters, softens or predicts a verdict — verdicts, account numbers, prices and revocation state enter a turn only as fact blocks rendered in code from API payloads, and the model's text is returned on a separate channel that nothing parses for facts; trial language is pinned by the renderer (a trial verdict renders as a trial verdict, never as a certificate); the key arrives by header only and is never stored, logged, echoed or placed in the model context; turns are rate-limited per key (the shell's own limiter, same 60/min shape) and actions additionally pass the shared REST limiter inside the shared callables; browser access is CORS-scoped to https://axiom-code.com on the browser-facing paths (/verify, /check, /revoked, /shell) by shell.BrowserCorsMiddleware — non-browser traffic is unchanged
  - id: PW-CHECKOUT
    covers: /billing/checkout
    situation: an authenticated key holder buys a credit pack; the checkout session is bound to the caller's key hash so the webhook can grant the right key
    gateway: verify_api.billing_checkout — the only path from a customer to a Stripe Checkout Session
    validation: API key authenticated before any Stripe call; pack must be a known pack with a configured price; while billing is paused (no Stripe secret configured on the host) the route answers an honest 501 rather than pretending
  - id: PW-WEBHOOK
    covers: /billing/webhook
    situation: Stripe reports a checkout completion or a refund; exactly one credit grant (or reversal) may result
    gateway: stripe_billing.handle_webhook — the only path from a payment event to a credit grant
    validation: Stripe HMAC signature verified against the webhook secret before the event is read; grants are idempotent on the Stripe session id (a replay grants nothing); refunds reverse the original grant
isolation:
  - point: CA private key (Ed25519)
    kind: signing
    tier: in-process-exception
    acceptance: "Wright (builder), 2026-11-09 — the key lives only in the production state directory on the service host (mode 0600, git-ignored by the F-AX-1 guard), is loaded only by the API process, and never leaves the host; certificates are signed in-process after the engine's checks pass. A separated signing service is the named scale-up step in docs/THREAT-MODEL.md."
  - point: customer API keys
    kind: credentials
    tier: in-process-exception
    acceptance: "Wright (builder), 2026-11-09 — only SHA-256 hashes of keys are stored (store.py api_keys); the plaintext exists only in the customer's hands and the request header. Caller identity everywhere in the system is the hash."
  - point: Stripe webhook secret
    kind: credentials
    tier: in-process-exception
    acceptance: "Wright (builder), 2026-11-09 — held in the host's environment file (mode 0600) and read only by the webhook route. No Stripe secret key is configured on the host by construction: checkout session creation through the vaulted restricted key happens off-host, and the host route answers 501 while billing is paused."
  - point: customer code held in the verification queue
    kind: critical-data
    tier: in-process-exception
    acceptance: "Wright (builder), 2026-11-09 — a queued job's submitted code is stored only until the job completes, then cleared from the store (the code hash and result are kept). Queued jobs are visible only to the submitting key."
  - point: shell conversation and submitted code at the model lane
    kind: critical-data
    tier: in-process-exception
    acceptance: "Wright (builder), 2026-11-11 — a shell turn's message, history and fact blocks are sent only to the model endpoint on the same host (loopback llama router, http://127.0.0.1:8830/v1 by default; the endpoint is env-configurable and no credential is configured for it). Nothing leaves the host; the model keeps no state between turns and cannot issue or alter verdicts (facts are rendered in code from API payloads, and the model's text is never parsed for facts). The caller's API key and its hash are never placed in the model context."
# Notes for the gate (flip package, 2026-11-09):
# - F-AX-8 disposition: /docs and /openapi.json on the API host stay
#   PUBLIC by deliberate decision. They disclose the documented route
#   table only — the same table this file declares and the public
#   docs publish — and agent discovery is a designed surface of this
#   product. Recorded here so the choice is on the record, per F-AX-8.
# - types carries web + payments only. The product's judgment face
#   (verdict correctness) does not fit the runner's web-check adapter
#   shape (it needs an API key and a code payload, not {text}); the
#   judgment differential is run agent-side per playbook section 7 —
#   the gate's own corpus from the 2026-10-23 full gate is the
#   standing set, re-run at this flip. The standalone MCP server
#   (mcp_server.py, Streamable HTTP) is built and tested in this repo
#   but is NOT deployed on the public surface, so it is not declared
#   as a probed type; the site says exactly that. The HOSTED MCP leg
#   (mcp_hosted.py, mounted at /mcp in the API process) is a
#   different face: it is declared in this file as the /mcp route
#   under its own pathway PW-MCP in the 0.3.0 package (gate record
#   axiomcode-mcp-slice1-2026-11-09, Ruling 2).
# - payments.links is empty on purpose: billing is PAUSED by the
#   owner's readiness-arming rule (2026-11-06). The Stripe webhook
#   endpoint and the three Payment Links are deactivated in Stripe
#   and stay deactivated at this flip; the site presents no buy
#   links. The links join this file when the owner arms billing.
# - No rate_limit block is declared: the per-key limiter (60/min,
#   limits.py) is enforced only after authentication, so the runner's
#   own-identity probes cannot reach it. RATE-BOUND proof is the
#   authenticated behaviour tests (services/api/tests) plus gate
#   spot-probes with a provisioned key — the same posture the gate
#   accepted at the 2026-10-23 full gate (NOT RUN there, code-read).
# - No artifacts block: this product predates the Stage-1/2 artifact
#   set (PRODUCT-DEFINITION / FAILURE-ANALYSIS /
#   SCAFFOLDING-CERTIFICATION were never produced for it), and the
#   schema forbids backfilling a retroactive scaffolding
#   certification. Its governing records are the production landing
#   pack and the 2026-10-23 gate verdict, both named in the flip
#   declaration.
# - MCP slice package (0.3.0, 2026-11-09): PW-MCP is its OWN pathway
#   (gate record axiomcode-mcp-slice1-2026-11-09, Ruling 2) — a new
#   transport with its own auth middleware is a distinct gate, even
#   though every tool behind it calls the same verify_api callables
#   the REST routes call. Version moves 0.2.0 -> 0.3.0 with this
#   release (minor: a new declared face, no REST behaviour change).
# - Per-transport auth-error difference, DECLARED and accepted (same
#   record, Ruling 3): on authentication failure the MCP leg answers
#   401 with the MCP error-envelope body {"error": "invalid or
#   missing API key"}, where REST answers FastAPI's {"detail": ...}
#   envelope. On each leg the 401 body is identical for a missing,
#   unknown or revoked key (no validity oracle), and every post-auth
#   body on the MCP leg is the REST body verbatim (tool results ARE
#   the REST response dicts). No harmonization is planned; the
#   difference is confined to the auth-failure envelope key
#   (error vs detail).
# - Legacy standalone mcp_server.py is recorded NAMED DRIFT (same
#   record, Ruling 4): deployed nowhere, and it must never be
#   deployed as-is — it predates the FIFO queue (per-key gate
#   admission) and keeps caller identity in a module global.
#   Hosting it would be a new gate declaration, not a config
#   change. The coverage ledger's MCP out_of_scope unit refers to
#   the standalone only; the hosted leg carries its own unit.
# - Interactive shell package (0.4.0, 2026-11-11): PW-SHELL is a NEW
#   pathway under Ruling 2's rule (a new face is its own gate) —
#   declared here on the build branch (feat/interactive-shell);
#   certification and deployment are the gate's, and nothing in this
#   package is live until the gate certifies it. Version moves
#   0.3.0 -> 0.4.0 (minor: a new declared face, no REST/MCP
#   behaviour change).
# - CORS finding + fix in the same package: the API shipped with NO
#   CORS leg, so the site's own /verify and /check pages — cross-
#   origin, preflighted fetches — were blocked by real browsers
#   (live-probed 2026-11-11: OPTIONS /verify answered 405 with no
#   Access-Control-Allow-Origin). shell.BrowserCorsMiddleware now
#   answers CORS for https://axiom-code.com only, on the browser-
#   facing paths only (/verify, /check, /revoked, /shell); route
#   declarations are unchanged and non-browser clients see
#   byte-identical behaviour. The gate is asked to note that the
#   pre-fix pages could not complete a submission from a browser.
# - The shell's model lane is box-local (loopback llama router,
#   qwen2.5-coder-7b): no new credential exists for it, no
#   conversation data leaves the host, and billing is untouched —
#   the shell states the site's published pricing and that packs
#   are not yet on sale; it sells nothing.
