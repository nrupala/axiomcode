name: Gate contract
on:
  push:
    branches: [main]
    paths:
      - "gate.yaml"
      - "docs/**"
      - "services/api/**"
      - "scripts/check_gate_contract.py"
      - ".github/workflows/gate.yml"
  pull_request:
    branches: [main]
    paths:
      - "gate.yaml"
      - "docs/**"
      - "services/api/**"
      - "scripts/check_gate_contract.py"
      - ".github/workflows/gate.yml"
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest fastapi httpx pydantic "mcp<2" stripe cryptography
      - name: Gate contract (gate.yaml vs shipped API + docs)
        run: python3 scripts/check_gate_contract.py
      - name: API test suite (declared gate test_command)
        run: python3 -m pytest services/api/tests -q
