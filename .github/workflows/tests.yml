name: Tests
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest cffi cryptography
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
      - name: Proof-honesty gate (no sorry/admit in verified library)
        # `sorry`/`admit` typecheck, so a green `lake build` is not enough.
        # lean/src/ holds ONLY machine-checked proofs; drafts live in lean/drafts/.
        # `shell: bash` — the step uses bash syntax and must not run under PowerShell on Windows.
        shell: bash
        run: |
          if grep -rEn '\b(sorry|admit)\b' lean/src/ --include='*.lean'; then
            echo "::error::sorry/admit found under lean/src/ — verified library must be machine-checked. Move drafts to lean/drafts/."
            exit 1
          fi
          echo "proof-honesty gate: clean"
      - name: Security tests
        run: python -m pytest tests/test_core.py::TestSecurity -v
      - name: Licensing tests
        run: python -m pytest tests/test_core.py::TestLicensing -v
      - name: Persistence tests
        run: python -m pytest tests/test_core.py::TestPersistence -v
